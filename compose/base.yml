name: bazario

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    entrypoint: ["/bin/sh", "/etc/seaweedfs/start.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      # Keep the Go heap well inside the container memory limit (limits.yml).
      GOMEMLIMIT: 320MiB
    volumes:
      - s3data:/data
      - ../seaweedfs/start.sh:/etc/seaweedfs/start.sh:ro
    ports:
      - "${S3_PORT}:8333"
      - "${S3_BROWSER_PORT}:8888"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *default-logging
    restart: unless-stopped

  seaweedfs-init:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ../seaweedfs/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ../toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "${TOXIPROXY_API_PORT}:8474"
    depends_on:
      - postgres
      - seaweedfs
    logging: *default-logging
    restart: unless-stopped

  api:
    profiles: ["app"]
    build:
      context: ../../bazario-api
    image: bazario-api:${API_TAG}
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@toxiproxy:15432/${POSTGRES_DB}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX}
      S3_ENDPOINT: http://toxiproxy:19000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_FORCE_PATH_STYLE: "true"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      PUBLIC_API_URL: ${WEB_API_URL}
      WEB_URL: http://localhost:${WEB_PORT}
    ports:
      - "${API_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      toxiproxy:
        condition: service_started
      seaweedfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  web:
    profiles: ["app"]
    build:
      context: ../../bazario-web
      args:
        VITE_API_URL: ${WEB_API_URL}
    image: bazario-web:${WEB_TAG}
    ports:
      - "${WEB_PORT}:80"
    depends_on:
      - api
    logging: *default-logging
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "${MAILPIT_UI_PORT}:8025"
    logging: *default-logging
    restart: unless-stopped

  loadgen:
    profiles: ["load"]
    image: grafana/k6:0.54.0
    environment:
      BASE_URL: http://api:3000
      TRAFFIC_MULTIPLIER: ${TRAFFIC_MULTIPLIER}
      MANIFEST: /loadgen/data/manifest.${LOADGEN_ENV:-dev}.json
      PROFILE: /loadgen/profile.json
      DURATION_HOURS: ${DURATION_HOURS:-}
      DURATION: ${DURATION:-}
      SIM_START_HOUR: ${SIM_START_HOUR:-}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: "p(95),p(99),avg"
    command: ["run", "-o", "experimental-prometheus-rw", "/loadgen/scenarios/${LOAD_SCENARIO}.js"]
    volumes:
      - ../loadgen:/loadgen:ro
    depends_on:
      - api
    logging: *default-logging

  postgres-exporter:
    profiles: ["monitoring"]
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  cadvisor:
    profiles: ["monitoring"]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    logging: *default-logging
    restart: unless-stopped

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION}
      - --web.enable-remote-write-receiver
    volumes:
      - ../monitoring/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    logging: *default-logging
    restart: unless-stopped

  loki:
    profiles: ["monitoring"]
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ../monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - lokidata:/loki
    logging: *default-logging
    restart: unless-stopped

  promtail:
    profiles: ["monitoring"]
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ../monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    logging: *default-logging
    restart: unless-stopped

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      - prometheus
      - loki
    logging: *default-logging
    restart: unless-stopped

volumes:
  pgdata:
  s3data:
  promdata:
  lokidata:
  grafanadata:
